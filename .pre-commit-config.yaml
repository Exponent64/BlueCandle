repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md,patch"]
        exclude: "\\.patch$"

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7 # v1.32.0
    hooks:
      - id: zizmor
        exclude: "^\\.github/workflows/config/linkspector\\.yml$"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5 # v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: f2f06f50bd9eed99488dad7aee9aed711a7d8d3e # v0.0.98
    hooks:
      - id: ty
        args: [--isolated]

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck
        description: "Shell script linter: https://www.shellcheck.net/"
        entry: shellcheck
        language: system
        types: [text]
        types_or: [bash, bats, shell]
