name: build-bluecandle

permissions: {}

on:
  workflow_call:
    inputs:
      recipe:
        type: string
        required: true
    secrets:
      SIGNING_SECRET:
        required: true
    outputs:
      IMAGE_DIGEST:
        value: ${{ jobs.bluebuild.outputs.IMAGE_DIGEST }}
      IMAGE_NAME:
        value: ${{ jobs.bluebuild.outputs.IMAGE_NAME }}
      IMAGE_TAG:
        value: ${{ jobs.bluebuild.outputs.IMAGE_TAG }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.recipe }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build BlueCandle
    runs-on: ubuntu-latest
    environment: Build

    outputs:
      FULL_IMAGE_REF: ${{ steps.image_data.outputs.FULL_IMAGE_REF }}
      IMAGE_NAME: ${{ steps.image_data.outputs.IMAGE_NAME }}
      IMAGE_DIGEST: ${{ steps.image_manifest_metadata.outputs.IMAGE_DIGEST }}
      IMAGE_TAG: ${{ steps.image_data.outputs.IMAGE_TAG }}

    permissions:
      contents: read # Needed to pull the repo for the build
      packages: write # Needed to publish images
      id-token: write # Needed for token generation for signing

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Gather image data from recipe
        id: image_data
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_EVENT_NUMBER: ${{ github.event.number }}
          RECIPE: ${{ inputs.recipe }}
        run: |
          IMAGE_NAME=$(yq -r '."name"' "./recipes/${RECIPE}")
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "BASE_IMAGE=$(yq -r '."base-image"' "./recipes/${RECIPE}")" >> "${GITHUB_OUTPUT}"
          echo "BASE_IMAGE_VERSION=$(yq -r '."image-version"' "./recipes/${RECIPE}")" >> "${GITHUB_OUTPUT}"

          case "$GITHUB_REF" in
            refs/heads/"$DEFAULT_BRANCH") image_tag='latest' ;;
            refs/pull/*) image_tag="pr-${PR_EVENT_NUMBER}-45" ;;
            *) image_tag="br-${GITHUB_REF_NAME}-45" ;;
          esac
          echo "IMAGE_TAG=${image_tag}" >> "${GITHUB_OUTPUT}"
          FULL_IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${image_tag}"
          echo "FULL_IMAGE_REF=${FULL_IMAGE_REF}" >> "${GITHUB_OUTPUT}"

      - name: Runner setup
        id: runner_setup
        uses: $/.github/workflows/shared-runner-setup
        with:
          needs_cosign: ${{ steps.image_data.outputs.IMAGE_NAME != 'securecore-main-hardened' && steps.image_data.outputs.IMAGE_NAME != 'iot-main-hardened' }}
          needs_slsa_oras: ${{ startsWith(steps.image_data.outputs.BASE_IMAGE, format('ghcr.io/{0}/', github.repository_owner)) }}

      - name: Verify base image provenance
        shell: bash
        if: startsWith(steps.image_data.outputs.BASE_IMAGE, format('ghcr.io/{0}/', github.repository_owner))
        env:
          BASE_IMAGE_VERSION: ${{ steps.image_data.outputs.BASE_IMAGE_VERSION }}
          BASE_IMAGE: ${{ steps.image_data.outputs.BASE_IMAGE }}
        run: |
          tempdir=$(mktemp -d)
          DIGEST=$(oras resolve "${BASE_IMAGE}:${BASE_IMAGE_VERSION}")
          oras pull -o "${tempdir}" "${BASE_IMAGE}:${DIGEST/:/-}-provenance"
          slsa-verifier build "${tempdir}/provenance.intoto.json" \
            --level 3 \
            --require-signatures \
            --signer 'sigstore(identityMatch=regex)::https://token.actions.githubusercontent.com::https://github\.com/slsa-framework/actions/\.github/workflows/attest_actions\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+' \
            --subject "${DIGEST}" \
            --param "expected_source:github.com/${GITHUB_REPOSITORY}" \
            --param 'expected_branch:live' \
            --param "trusted_builders:[https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-all.yml@refs/heads/live]"
          # remove slsa-verifier so that it can be successfully reinstalled later by bluebuild
          rm -rf ~/.slsa/ "${tempdir}"

      - name: Verify base image signature
        shell: bash
        if: steps.image_data.outputs.IMAGE_NAME != 'securecore-main-hardened' && steps.image_data.outputs.IMAGE_NAME != 'iot-main-hardened'
        env:
          BASE_IMAGE_VERSION: ${{ steps.image_data.outputs.BASE_IMAGE_VERSION }}
          BASE_IMAGE: ${{ steps.image_data.outputs.BASE_IMAGE }}
        run: |
          UPSTREAM_CONTAINER="${BASE_IMAGE}:${BASE_IMAGE_VERSION}"
          if [[ "$BASE_IMAGE" == "ghcr.io/${GITHUB_REPOSITORY_OWNER}/"* ]]; then
            UPSTREAM_PUBKEY='./cosign.pub'
          else
            UPSTREAM_PUBKEY='./files/system/usr/share/pki/containers/secureblue.pub'
          fi
          if ! cosign verify --key "${UPSTREAM_PUBKEY}" "${UPSTREAM_CONTAINER}" | jq; then
            echo "NOTICE: Verification failed. Please ensure your public key is correct."
            exit 1
          fi

      - name: Create digestfile
        id: digestfile
        shell: bash
        run: |
          echo "digestfile=$(mktemp)" >>"${GITHUB_OUTPUT}"

      - name: Build BlueCandle
        uses: blue-build/github-action@fb86c457fd3d0e13d5e9c1875c6305cf28b09234 # v1.14.0
        with:
          # renovate: datasource=github-releases depName=blue-build/cli
          cli_version: v0.9.41
          recipe: ${{ inputs.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          skip_checkout: true
          use_cache: false
          retry_push_count: 3
          verify_install: true
          digestfile: ${{ steps.digestfile.outputs.digestfile }}

      - name: Output image digest
        id: image_manifest_metadata
        shell: bash
        env:
          DIGESTFILE: ${{ steps.digestfile.outputs.digestfile }}
          FULL_IMAGE_REF: ${{ steps.image_data.outputs.FULL_IMAGE_REF }}
        run: |
          IMAGE_DIGEST=$(jq -er --arg ref "${FULL_IMAGE_REF}" '.[$ref]' "${DIGESTFILE}")
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [bluebuild]
    permissions:
      actions: read # To detect the Github Actions environment
      contents: read
      id-token: write # To create OIDC tokens for signing
    uses: slsa-framework/actions/.github/workflows/attest_actions.yml@v0.2.0 # zizmor: ignore[unpinned-uses]
    with:
      build-from-source: false
      # renovate: datasource=github-releases depName=slsa-framework/attester
      version: v0.1.1
      watch-jobs: bluebuild
      collect-artifacts: false
      subjects: ${{ needs.bluebuild.outputs.IMAGE_DIGEST }}
      artifact-name: slsa-provenance-${{ needs.bluebuild.outputs.IMAGE_NAME }}

  push-attestation:
    needs: [bluebuild, provenance]
    permissions:
      packages: write # To push attestation to GHCR
    uses: $/.github/workflows/push-provenance.yml
    with:
      artifact-name: slsa-provenance-${{ needs.bluebuild.outputs.IMAGE_NAME }}
      image-ref: ${{ needs.bluebuild.outputs.FULL_IMAGE_REF }}
      digest: ${{ needs.bluebuild.outputs.IMAGE_DIGEST }}
