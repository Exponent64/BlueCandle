name: shared-runner-setup

description: Build runner setup

inputs:
  needs_cosign:
    description: "Whether to install cosign, otherwise 'false'."
    required: false
    default: "false"
  needs_slsa_oras:
    description: "Whether to install slsa-verifier and ORAS, otherwise 'false'."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Optimise build times
      shell: bash
      run: |
        echo 'set man-db/auto-update false' | sudo debconf-communicate
        sudo dpkg-reconfigure man-db
        sudo rm -f /var/lib/man-db/auto-update
        echo 'update_initramfs=no' | sudo tee /etc/initramfs-tools/update-initramfs.conf > /dev/null

    - name: Drop Ubuntu HTTP mirrors and chrome repo
      shell: bash
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome*
        sudo sed -i '/^http:\/\//d' /etc/apt/apt-mirrors.txt
        sudo apt-get update

    - name: Install cosign
      uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      if: ${{ inputs.needs_cosign == 'true' }}
      with:
        cosign-release: "v2.6.0"

    - name: Install oras
      if: ${{ inputs.needs_slsa_oras == 'true' }}
      uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
      with:
        # renovate: datasource=github-releases depName=oras-project/oras
        version: 1.3.6

    - name: Install slsa-verifier
      if: ${{ inputs.needs_slsa_oras == 'true' }}
      uses: slsa-framework/actions/install/verifier@85f26c270f0c7a4d73515845349629a2dfd023f4 # v0.2.2
      with:
        # renovate: datasource=github-releases depName=slsa-framework/verifier
        version: v0.1.1
