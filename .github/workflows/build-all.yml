name: build

permissions: {}

on:
  schedule:
    - cron:
        "40 5 * * *"

  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluecandle-main:
    name: Build BlueCandle main
    if: github.triggering_actor == 'exponent64' || github.event_name == 'schedule' || github.event_name == 'push'
    permissions:
      actions: read # Needed to read actions and actions logs for provenance generation
      contents: read # Needed to pull the repo for the build
      id-token: write # Needed for token generation for signing
      packages: write # Needed to publish images

    uses: $/.github/workflows/build-one-recipe.yml
    with:
      recipe: general/recipe-main.yml
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  bluecandle-nvidia:
    name: Build BlueCandle nvidia
    if: github.triggering_actor == 'exponent64' || github.event_name == 'schedule' || github.event_name == 'push'
    permissions:
      actions: read # Needed to read actions and actions logs for provenance generation
      contents: read # Needed to pull the repo for the build
      id-token: write # Needed for token generation for signing
      packages: write # Needed to publish images

    uses: $/.github/workflows/build-one-recipe.yml
    with:
      recipe: general/recipe-nvidia.yml
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

  bluecandle-nvidia-open:
    name: Build BlueCandle nvidia-open
    if: github.triggering_actor == 'exponent64' || github.event_name == 'schedule' || github.event_name == 'push'
    permissions:
      actions: read # Needed to read actions and actions logs for provenance generation
      contents: read # Needed to pull the repo for the build
      id-token: write # Needed for token generation for signing
      packages: write # Needed to publish images

    uses: $/.github/workflows/build-one-recipe.yml
    with:
      recipe: general/recipe-nvidia-open.yml
    secrets:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
