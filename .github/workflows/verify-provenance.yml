name: verify-provenance

permissions: {}

on:
  schedule:
    - cron: "00 15 * * *"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-provenance:
    name: Verify provenance
    if: github.triggering_actor == 'exponent64' || github.event_name == 'schedule'
    runs-on: ubuntu-slim
    permissions:
      packages: read # Needed to pull images

    steps:
      - name: Install oras
        uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v2.0.4
        with:
          # renovate: datasource=github-releases depName=oras-project/oras
          version: 1.4.0

      - name: Install slsa-verifier
        uses: slsa-framework/actions/install/verifier@3efdf6f2112b1170cb369442620788752df11bca # v0.2.0
        with:
          # renovate: datasource=github-releases depName=slsa-framework/verifier
          version: v0.1.2

      - name: Verify provenance
        shell: bash
        run: |
          set -euo pipefail
          images=(
            bluecandle-main
            bluecandle-nvidia
            bluecandle-nvidia-open
          )

          verify_provenance() {
            local image_ref="$1"
            local tag="$2"
            local tempdir
            tempdir=$(mktemp -d)
            trap 'rm -rf "${tempdir}"' RETURN

            local referrers
            referrers=$(
              oras discover --format json \
                --artifact-type 'application/vnd.in-toto.provenance+dsse' \
                "${image_ref}:${tag}"
            ) || return 1

            local image_digest
            image_digest=$(jq -er '.digest' <<<"${referrers}") || return 1

            local provenance_digest
            provenance_digest=$(jq -er '.referrers[].digest' <<<"${referrers}") || return 1
            if [[ -z "${provenance_digest}" ]]; then
              echo "Provenance not found for ${image_ref}@${image_digest}"
              return 1
            elif [[ "${provenance_digest}" == *$'\n'* ]]; then
              echo "More than one provenance artifact found for ${image_ref}@${image_digest}"
              return 1
            fi

            # Confirm that provenance can also be pulled by tag
            local prov_by_tag="${image_ref}:${image_digest/:/-}-provenance"
            local prov_tag_digest
            prov_tag_digest=$(oras resolve "${prov_by_tag}") \
              || { echo "Unable to resolve provenance by tag: ${prov_by_tag}"; return 1; }
            if [[ "${prov_tag_digest}" != "${provenance_digest}" ]]; then
              echo "Provenance digest mismatch for ${prov_by_tag}"
              return 1
            fi

            echo "Verifying provenance for ${image_ref}@${image_digest}..."
            oras pull -o "${tempdir}" "${image_ref}@${provenance_digest}" || return 1
            slsa-verifier build "${tempdir}/provenance.intoto.json" \
              --level 3 \
              --require-signatures \
              --signer 'sigstore(identityMatch=regex)::https://token.actions.githubusercontent.com::https://github\.com/slsa-framework/actions/\.github/workflows/attest_actions\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+' \
              --subject "${image_digest}" \
              --param 'expected_source:github.com/Exponent64/BlueCandle' \
              --param 'expected_branch:main' \
              --param 'trusted_builders:[https://github.com/Exponent64/BlueCandle/.github/workflows/build-all.yml@refs/heads/main]'
          }

          failed_images=()
          for image_name in "${images[@]}"; do
            image_ref="ghcr.io/exponent64/${image_name}"
            for tag in latest; do
              if ! verify_provenance "${image_ref}" "${tag}"; then
                failed_images+=("${image_name}:${tag}")
                echo "FAIL: Provenance verification failed for ${image_name}:${tag}"
              fi
              echo
            done
          done
          if [[ "${#failed_images[@]}" -gt 0 ]]; then
            echo "FAIL: the following images failed provenance verification: ${failed_images[*]}"
            exit 1
          fi
