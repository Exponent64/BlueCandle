name: build

permissions: {}

on:
  schedule:
    - cron:
        "00 06 * * *"

  push:
    branches-ignore:
      - "dependabot/**"
    paths-ignore:
      - "**.md"

  pull_request:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BlueCandle
    runs-on: ubuntu-latest
    if: github.triggering_actor == 'exponent64' || github.event_name == 'schedule' || github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - general/recipe-main.yml
          - general/recipe-nvidia-open.yml
          - general/recipe-nvidia.yml

    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@c295af864f2802fc6aea227507af43d35823db81 # v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
