name: build

permissions: {}

on:
  schedule:
    - cron:
        "00 06 * * *"

  push:
    branches:
      - "main"
    paths-ignore:
      - "**.md"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BlueCandle
    runs-on: ubuntu-latest
    if: github.triggering_actor == 'exponent64' || github.event_name == 'schedule' || github.event_name == 'push'
    permissions:
      contents: read # Needed to pull the repo for the build
      packages: write # Needed to publish images
      id-token: write # Needed for token generation for signing
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - general/recipe-main.yml
          - general/recipe-nvidia-open.yml
          - general/recipe-nvidia.yml

    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@fb86c457fd3d0e13d5e9c1875c6305cf28b09234 # v1.14
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
