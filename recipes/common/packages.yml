type: dnf
source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
repos:
  copr:
    - name: duxlabs/dms
      chroot: fedora-45-x86_64

    - name: exponent64/packages
      chroot: fedora-45-x86_64

remove:
  auto-remove: true
  packages:
    - containerd
    - docker-buildx
    - docker-cli
    - docker-compose
    - moby-engine
    - moby-engine-rootless-extras

    - orca
    - polkit-qt6-1
    - qt6-qtwebengine
    - sway
    - swaybg
    - swayidle
    - swaylock
    - tumbler
    - waybar
    - xdg-desktop-portal-wlr

    - Thunar
    - dangerzone
    - foot
    - nm-connection-editor
    - pavucontrol
    - tuned-switcher
    - xarchiver
    - dunst
    - rofi
    - rofi-themes
    - grim

    - system-config-printer
    - system-config-printer-libs
    - system-config-printer-udev
    - braille-printer-app

    - blueman
    - bluez

    - 7zip
    - 7zip-standalone-all

install:
  install-weak-deps: false
  packages:
    - niri
    - xdg-desktop-portal-gnome
    - xdg-user-dirs
    - ly

    - dms
    - matugen
    - qt6ct
    - quickshell

    - alacritty
    - yazi
