modules:
  - type: files
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    files:
      - source: system/usr/share/pki/rpm-gpg
        destination: /usr/share/pki/rpm-gpg

      - source: system/usr/share/dnf5/repos.d
        destination: /usr/share/dnf5/repos.d

  - type: dnf
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    remove:
      auto-remove: true
      packages:
        - containerd
        - docker-buildx
        - docker-cli
        - docker-compose
        - moby-engine
        - moby-engine-rootless-extras

        - qt6-qtwebengine
        - sway
        - swaybg
        - swayidle
        - swaylock
        - waybar
        - xdg-desktop-portal-wlr

        - dunst
        - foot
        - grim
        - nano
        - nano-default-editor
        - orca
        - pavucontrol
        - polkit-qt6-1
        - rofi
        - rofi-themes
        - tuned-switcher

        - braille-printer-app
        - system-config-printer
        - system-config-printer-libs
        - system-config-printer-udev

        - NetworkManager-openconnect
        - NetworkManager-openvpn
        - blueman
        - bluez
        - nm-connection-editor

        - 7zip
        - 7zip-standalone-all
        - Thunar
        - dangerzone
        - tumbler
        - xarchiver

    install:
      install-weak-deps: false
      packages:
        - niri
        - xdg-desktop-portal-gnome
        - xdg-user-dirs

        - dms
        - matugen
        - qt6ct
        - quickshell

        - alacritty
        - yazi
