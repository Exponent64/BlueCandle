modules:
  - from-file: common/packages.yml

  - type: files
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    files:
      - source: system/usr
        destination: /usr

      - source: system/etc
        destination: /etc

      - source: patches
        destination: /root/patches

  - type: systemd
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    system:
      enabled:
        - ly@tty2.service
      disabled:
        - kmsconvt@tt23.service
      masked:
        - kmsconvt@tty2.service

    user:
      disabled:
        - xwayland-satellite.service
      masked:
        - xwayland-satellite.service

  - type: gschema-overrides
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    include:
      - bluecandle.gschema.override

  - type: script
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
    scripts:
      - apply-patches.sh

  - type: signing
    source: ghcr.io/blue-build/modules@sha256:bb9eddf80d21f7dbe9514ed9e1e0ba052a33d4e2c72b940916cd0d5fee7b0f94
